name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.dependencies }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            php: '8.2'
            laravel: '10'
            testbench: '^8.0'
            dependencies: highest
            composer_options: '--no-security-blocking'
          - os: ubuntu-latest
            php: '8.2'
            laravel: '10'
            testbench: '^8.0'
            dependencies: lowest
            composer_options: '--no-security-blocking'
          - os: ubuntu-latest
            php: '8.2'
            laravel: '11'
            testbench: '^9.0'
            dependencies: highest
            composer_options: '--no-security-blocking'
          - os: ubuntu-latest
            php: '8.2'
            laravel: '12'
            testbench: '^10.0'
            dependencies: highest
            composer_options: ''
          - os: ubuntu-latest
            php: '8.3'
            laravel: '13'
            testbench: '^11.0'
            dependencies: highest
            composer_options: ''
          - os: ubuntu-latest
            php: '8.5'
            laravel: '13'
            testbench: '^11.0'
            dependencies: highest
            composer_options: ''
          - os: windows-latest
            php: '8.3'
            laravel: '13'
            testbench: '^11.0'
            dependencies: highest
            composer_options: ''

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Select Testbench
        run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction

      - name: Install dependencies
        uses: ramsey/composer-install@4.0.0
        with:
          dependency-versions: ${{ matrix.dependencies }}
          composer-options: ${{ matrix.composer_options }}

      - name: Run tests
        run: composer test

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@4.0.0
        with:
          dependency-versions: highest

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Audit dependencies
        run: composer audit --no-interaction

      - name: Run quality suite
        run: composer check

      - name: Enforce test coverage
        run: composer test:coverage
